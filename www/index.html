<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>To be read</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cpath%20d%3D%22M49%2025c-2-3%202-5%200-8M54%2026c-2-3%202-5%200-8%22%20fill%3D%22none%22%20stroke%3D%22%23b894d0%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22/%3E%3Crect%20x%3D%226%22%20y%3D%2247%22%20width%3D%2240%22%20height%3D%229%22%20rx%3D%222%22%20fill%3D%22%235b2a7a%22/%3E%3Cpath%20d%3D%22M9%2051.5h32%22%20stroke%3D%22%23efe4f6%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22/%3E%3Crect%20x%3D%229%22%20y%3D%2239%22%20width%3D%2235%22%20height%3D%228.5%22%20rx%3D%222%22%20fill%3D%22%23b58bd3%22/%3E%3Cpath%20d%3D%22M12%2043.3h28%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M40%2037c6%200%206%207%200%207%22%20fill%3D%22none%22%20stroke%3D%22%231f1826%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22/%3E%3Cellipse%20cx%3D%2229%22%20cy%3D%2233%22%20rx%3D%2213%22%20ry%3D%227%22%20fill%3D%22%231f1826%22/%3E%3Cpath%20d%3D%22M12.5%2025l1-7%205%204.2zM22.5%2022.2l5-3.7.2%207z%22%20fill%3D%22%231f1826%22/%3E%3Ccircle%20cx%3D%2219%22%20cy%3D%2229%22%20r%3D%227.4%22%20fill%3D%22%231f1826%22/%3E%3Cpath%20d%3D%22M14.3%2018.9l.5%203.3%202.2-1.7zM26.6%2020.7l-2.4%201.8%202.6%201.3z%22%20fill%3D%22%23c9a7de%22/%3E%3Cpath%20d%3D%22M14.6%2028.6q1.6%201.4%203.2%200M20.4%2028.6q1.6%201.4%203.2%200%22%20fill%3D%22none%22%20stroke%3D%22%23e9dcf3%22%20stroke-width%3D%221.3%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M18.2%2031.2h1.6l-.8%201z%22%20fill%3D%22%23f2a7c3%22/%3E%3Crect%20x%3D%2246%22%20y%3D%2231%22%20width%3D%2213%22%20height%3D%2217%22%20rx%3D%223.5%22%20fill%3D%22%237f47a3%22/%3E%3Cpath%20d%3D%22M59%2035.5c4%200%204%207.5%200%207.5%22%20fill%3D%22none%22%20stroke%3D%22%237f47a3%22%20stroke-width%3D%222.6%22/%3E%3Crect%20x%3D%2246%22%20y%3D%2231%22%20width%3D%2213%22%20height%3D%223.4%22%20rx%3D%221.7%22%20fill%3D%22%235b2a7a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --parch:#ece3ef; --parch2:#f8f3f8; --parch3:#e3d6e9;
  --ink:#2a1d33; --ink2:#6b587a; --line:#cbb8d5;
  --lilac:#9a73b8; --plum:#5b2a7a; --plum2:#7f47a3; --star:#8b58b3; --star0:#dccde4;
  --font-title:'Fraunces',Georgia,serif;
  --font-body:'DM Sans',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,label,[role=button]{touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{
  margin:0;background-color:var(--parch);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.35;
  background-image:
    radial-gradient(ellipse at 15% 0%,rgba(255,250,255,.75),transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(120,70,160,.2),transparent 55%);
  min-height:100vh;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.app{max-width:520px;margin:0 auto;padding:18px 16px calc(132px + env(safe-area-inset-bottom,0px))}

/* Cabecera */
.head .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.head h1{font-family:var(--font-title);font-weight:600;font-size:36px;margin:0;letter-spacing:-.5px;line-height:1.05;color:var(--plum)}
.head .top{justify-content:space-between;align-items:center;gap:12px}
.head h1{white-space:nowrap;font-size:clamp(24px,7.4vw,34px)}
.brand{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 auto}
.logo{width:50px;height:50px;flex:none;margin-left:-6px}
.brand h1{min-width:0}
.tr{display:flex;align-items:center;gap:4px;flex:none}
.tr .count{font-size:13.5px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.gear{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none}
.gear:active{background:var(--parch3)}
.sharetxt{width:100%;height:46vh;min-height:220px;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:var(--ink);white-space:pre-wrap;overflow:auto;outline:0}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.chk .chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#f8f0fb}
.count{font-size:15px;color:var(--ink2);white-space:nowrap}
.count{text-align:right}
.count i{font-style:normal;margin:0 6px;color:var(--line)}
.rule{height:1px;margin:12px 0 14px;background:linear-gradient(90deg,transparent,var(--lilac),transparent);opacity:.7}

.search{display:flex;align-items:center;gap:8px;background:var(--parch2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:inset 0 1px 3px rgba(70,30,100,.12)}
.search input{flex:1;border:0;background:transparent;outline:0;font-size:16px;min-width:0}
.search input::placeholder{color:#9b89a8;font-style:italic}
.search svg{flex:none;color:var(--ink2)}
.chips{display:flex;gap:5px;margin:9px 0 2px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips .chip{font-size:13px;padding:4px 8px}.chips{gap:4px}.chips .chip.filt{position:sticky;right:0;background:#f6eff9;box-shadow:-8px 0 8px 2px #f6eff9}
.chip{padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;color:var(--ink2);flex:none;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#f8f0fb}
.chip.filt{margin-left:auto;display:flex;align-items:center;gap:4px;padding:4px 9px}.chip.filt b{font-weight:600}
.chip.filt.on{border-color:var(--plum2);color:var(--plum2)}

/* Lista */
.list{margin-top:8px}
.card{background:var(--parch2);border:1px solid var(--line);border-radius:8px;margin:0 0 12px;
  box-shadow:0 1px 4px rgba(60,25,85,.12);overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 76px}
.card.uni{background:var(--parch3);border-color:#b99bcb;box-shadow:0 2px 6px rgba(60,25,85,.16)}
.card.uni .card{margin:0 8px 10px}
.card.done{opacity:.72}
.ghead{display:flex;align-items:center;gap:10px;padding:13px 10px 13px 14px;width:100%;text-align:left;cursor:pointer}
.ghead .ttl{flex:1;min-width:0}
.gname{font-family:var(--font-title);font-weight:600;font-size:18px;line-height:1.2}
.gmeta{color:var(--ink2);font-size:14px}
.gside{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:13px;color:var(--ink2)}
.chev{transition:transform .2s;color:var(--lilac);flex:none}
.open>.ghead .chev{transform:rotate(90deg)}
.pen{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--plum2);border:1px solid var(--line);background:rgba(255,255,255,.5)}
.pen:active{background:var(--parch3)}
.gbody{display:none;border-top:1px dashed var(--line);padding:2px 0 6px}
.open>.gbody{display:block}
.card.uni>.gbody{padding-top:10px}

.row{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;position:relative}
.row+.row{border-top:1px dotted var(--line)}
.list>.row{background:var(--parch2);border:1px solid var(--line);border-radius:8px;margin:0 0 12px;
  box-shadow:0 1px 4px rgba(60,25,85,.12);content-visibility:auto;contain-intrinsic-size:auto 74px}
.list>.row+.row{border-top:1px solid var(--line)}
.seal{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--lilac);display:grid;place-items:center;color:transparent;background:radial-gradient(circle at 35% 30%,#fff,#eadff0)}
.seal svg{width:16px;height:16px}
.read .seal{background:radial-gradient(circle at 35% 30%,var(--plum2),var(--plum));border-color:#3f1a57;color:#f5e9fb}
.cov{flex:none;width:36px;height:52px;border-radius:4px;border:1px solid var(--line);background:linear-gradient(145deg,#b894d0,#6d3c90);display:grid;place-items:center;color:#f6ecfb;font-family:var(--font-title);font-weight:600;font-size:19px;overflow:hidden;box-shadow:1px 2px 4px rgba(60,25,85,.3)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.bt{flex:1;min-width:0}
.btitle{font-family:var(--font-title);font-weight:600;font-size:16px;line-height:1.2}
.bauth{color:var(--ink2);font-size:14px}
body.nostrike .read .btitle,body.nostrike .read .bauth{text-decoration:none}
.nav #gear.upd,#gear.upd{position:relative}#gear.upd::after{content:"";position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:#e0457b;border:2px solid #fff}
.ffrow{display:flex;gap:8px;align-items:stretch;margin:14px 0 4px}.ffrow .fromfile{margin:0;flex:1 1 0;min-width:0;width:auto}
.isbnb{flex:none;width:74px;border:1.5px dashed var(--lilac);border-radius:12px;background:#fff;color:var(--plum2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;font:inherit;font-weight:700;font-size:13px;letter-spacing:.6px;cursor:pointer}.isbnb:active{background:var(--parch3)}.isbnb[hidden]{display:none}.isbnb:only-child{width:100%;flex-direction:row;gap:10px;padding:12px}
.withbtn{display:flex;gap:8px;align-items:stretch}.withbtn input{flex:1;min-width:0}
.scanb{flex:none;width:48px;border:1px solid var(--line);border-radius:12px;background:#f6effa;color:var(--plum);display:grid;place-items:center;cursor:pointer}.scanb:active{background:var(--parch3)}.scanb[hidden]{display:none}
#scan{position:fixed;inset:0;z-index:90;background:#000;display:none;flex-direction:column;color:#fff}#scan.on{display:flex}
#scan video{flex:1;min-height:0;width:100%;object-fit:cover;background:#111}
.scfr{position:absolute;left:8%;right:8%;top:22%;height:26%;border:2px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.scbar{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#1b1224;display:flex;flex-direction:column;gap:10px}
#scmsg{font-size:14px;text-align:center;opacity:.9}
.scman{display:flex;gap:8px}.scman input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid #5a4870;background:#2a1d38;color:#fff;font-size:16px}
.scman button,#scx{padding:10px 16px;border-radius:10px;border:0;background:#7b3fa0;color:#fff;font-size:15px;font-weight:600}#scx{background:transparent;border:1px solid #5a4870}
.read .btitle,.read .bauth{text-decoration:line-through;text-decoration-color:var(--plum2);text-decoration-thickness:1.5px;color:#8c7b98}
.ord{font-family:var(--font-title);font-weight:600;color:var(--lilac);width:20px;text-align:center;flex:none;font-size:16px}
.br{flex:none;text-align:right;font-size:14px;color:var(--ink2);padding:6px 0 6px 6px;margin:-6px 0}
.br .add{color:var(--lilac);font-size:14px;border:1px dashed var(--line);border-radius:999px;padding:2px 8px}

.st{position:relative;display:inline-block;color:var(--star0);font-family:Arial,sans-serif;line-height:1}
.st b{position:absolute;left:0;top:0;overflow:hidden;color:var(--star);font-weight:400;white-space:nowrap}
.stars{display:inline-flex;font-size:14px;letter-spacing:1px}
.empty{text-align:center;color:var(--ink2);padding:40px 20px}

/* FAB + menú */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--plum2),var(--plum));color:#f8eefc;display:grid;place-items:center;
  border:0;box-shadow:0 4px 12px rgba(50,15,75,.4);z-index:20}
.fab svg{transition:transform .2s}
.fab.on svg{transform:rotate(45deg)}
.menu{position:fixed;left:0;right:0;margin:0 auto;width:236px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--parch2);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 20px rgba(50,15,75,.28);z-index:21;display:none;padding:6px}
.menu.on{display:block;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.menu button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 10px;font-size:16px;border-radius:8px}
.menu button:active{background:var(--parch3)}
.menu .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}

/* Hoja inferior */
.back{position:fixed;inset:0;background:rgba(35,15,50,.5);z-index:30;opacity:0;visibility:hidden;transition:opacity .22s ease,visibility 0s .22s}
.back.on{opacity:1;visibility:visible;transition:opacity .22s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92%;overflow:auto;z-index:31;
  background:var(--parch2);border-radius:18px 18px 0 0;padding:0 18px calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.3,1);box-shadow:0 -8px 24px rgba(35,15,50,.35)}
.sheet{contain:layout paint;overscroll-behavior:contain;will-change:transform;backface-visibility:hidden}
.sheet.on{transform:translate3d(0,0,0)}
.menu,.fab,.toast{will-change:transform,opacity}
.hero{margin:0 -18px 6px;padding:10px 18px 18px;color:#fbf4fe;position:relative;overflow:hidden;
  background:radial-gradient(circle at 85% -20%,rgba(255,255,255,.28),transparent 45%),linear-gradient(135deg,var(--plum2),var(--plum) 70%,#43195d)}
.hero::after{content:"";position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;border:1px solid rgba(255,255,255,.15);box-shadow:0 0 0 18px rgba(255,255,255,.05)}
.grip{width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.55);margin:0 auto 12px}
.hero{touch-action:none;cursor:grab}
.sheet.drag{transition:none}
.back.drag{transition:none}
.hrow{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.medal{flex:none;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center}
.hero .cov{width:62px;height:90px;font-size:32px;border-color:rgba(255,255,255,.4);background:linear-gradient(145deg,#caa9e0,#8a55ad);box-shadow:3px 5px 12px rgba(20,5,30,.4)}
.hero h2{font-family:var(--font-title);font-weight:600;font-size:24px;margin:0;line-height:1.1}
.hero .hs{opacity:.85;font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.covbtn{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff}
.notebtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;font-size:13px;color:var(--plum2);background:var(--parch3);border:1.5px dashed var(--lilac);border-radius:999px;padding:6px 12px;cursor:pointer}
.notebtn.has{border-style:solid;background:var(--plum2);color:#fff}
#bnote{margin-top:8px;width:100%;box-sizing:border-box;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;resize:vertical;min-height:50px;color-scheme:light}
.lead{color:var(--ink2);margin:10px 0 0}
.f{margin:14px 0}
.f label,.lbl{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.f input[type=text],.f input[type=number],.f input[type=date],.f select{width:100%;padding:10px 12px;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font-size:16px;outline:0;transition:border-color .15s,box-shadow .15s;color-scheme:light}
.f input:focus,.f select:focus{border-color:var(--plum2);box-shadow:0 0 0 3px rgba(127,71,163,.18)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two.pair{grid-template-columns:minmax(0,1fr) 104px}
.two.pair.solo{grid-template-columns:minmax(0,1fr)}
.fromfile{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border:1.5px dashed var(--lilac);border-radius:12px;background:#fff;cursor:pointer}
.fromfile:active{background:var(--parch3)}
.fromfile.done{border-style:solid;border-color:var(--plum2);background:#f6effa}
.filled{animation:fill 1.2s ease}
@keyframes fill{0%{background:#eadcf5;border-color:var(--plum2)}100%{background:#fff}}
.fromfile .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--parch3);color:var(--plum2);flex:none}
.fromfile b{font-weight:600;display:block}.fromfile small{color:var(--ink2);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--parch3);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px;border-radius:9px;font-size:15px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--plum);box-shadow:0 1px 4px rgba(60,25,85,.2);font-weight:600}
.box{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.rate{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rs{position:relative;display:inline-block;font-family:Arial,sans-serif;line-height:1;color:var(--star0);font-size:36px;margin-right:2px}
.rs b{position:absolute;left:0;top:0;overflow:hidden;color:var(--star);font-weight:400;white-space:nowrap;pointer-events:none}
.rs .h{position:absolute;top:-6px;bottom:-6px;width:50%}
.rs .h.l{left:0}.rs .h.r{right:0}
.rate .val{font-family:var(--font-title);font-weight:600;font-size:20px;min-width:34px;color:var(--plum)}
.mini{font-size:14px;color:var(--plum2);text-decoration:underline;text-underline-offset:3px}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;font-weight:500;text-align:center;background:#fff}
.btn.main{background:linear-gradient(135deg,var(--plum2),var(--plum));border-color:var(--plum);color:#fff;box-shadow:0 3px 10px rgba(91,42,122,.35)}
.btn.del{flex:none;border-color:#b4577a;color:#9c2f58;padding:12px 14px;transition:all .15s}
.btn.del.arm{background:#9c2f58;color:#fff;border-color:#9c2f58}
.hint{font-size:13px;color:var(--ink2);margin-top:5px}
.toast{font-size:15px;position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plum);color:#fbf4fe;padding:9px 16px;border-radius:10px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center}
.toast.on{opacity:1}

/* ---------- archivos de los libros (copia guardada en la app; en el navegador, IndexedDB) ---------- */
const FICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
const NATIVE=!!(CAP&&(CAP.FileOpener||(window.Capacitor&&window.Capacitor.registerPlugin)));
const MAXMETA=24*1024*1024; /* tope para el respaldo de "leer el archivo entero" si la lectura por trozos falla */
const FS=(()=>{
  const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open('tbr-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
  const op=(mode,fn)=>idb().then(db=>new Promise((ok,ko)=>{const tx=db.transaction('f',mode),rq=fn(tx.objectStore('f'));tx.oncomplete=()=>ok(rq&&rq.result);tx.onerror=()=>ko(tx.error)}));
  const FO=()=>(CAP&&CAP.FileOpener)||(window.Capacitor&&window.Capacitor.registerPlugin?window.Capacitor.registerPlugin('FileOpener'):null);
  const mime=n=>/\.pdf$/i.test(n)?'application/pdf':'application/epub+zip';
  const why=e=>String(e&&(e.message||e));
  return {
    /* Android: abre el selector del sistema y guarda el enlace (uri) con permiso permanente; no copia el archivo */
    async pickNative(){
      const fo=FO();if(!fo)throw new Error('fail');
      let r;try{r=await fo.pick()}catch(e){throw new Error(/cancel/i.test(why(e))?'cancelled':'fail')}
      const type=r.type&&r.type!=='application/octet-stream'?r.type:mime(r.name||'');
      const ref={name:r.name||'libro',type,uri:r.uri};
      const size=+r.size||0;
      return {file:{name:ref.name,size,rf:FS.range(ref,size),fallback:size&&size<=MAXMETA?async()=>new File([await FS.get(ref)],ref.name,{type}):null},ref};
    },
    /* lectura por trozos: solo se piden al sistema los bytes que hacen falta (nunca el archivo entero) */
    range(ref,size){
      const fo=FO();
      return {size,async read(off,len){
        const r=await fo.readRange({uri:ref.uri,offset:off,length:len});
        const bin=atob(r.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}};
    },
    /* navegador (vista previa): no existen enlaces a archivos del dispositivo, se guarda en IndexedDB */
    async put(id,file){await op('readwrite',st=>st.put(file,id));return {name:file.name,type:mime(file.name),idb:id}},
    async get(ref){
      if(ref.uri){const fo=FO();if(!fo)throw new Error('fail');
        let r;try{r=await fo.read({uri:ref.uri})}catch(e){throw new Error(/not_found|permission|security/i.test(why(e))?'gone':'fail')}
        const bin=atob(r.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:ref.type})}
      if(ref.idb){const f=await op('readonly',st=>st.get(ref.idb));if(f)return f}
      throw new Error('gone');
    },
    async open(ref){
      if(ref.uri){const fo=FO();if(!fo)throw new Error('fail');
        try{await fo.open({uri:ref.uri,type:ref.type})}
        catch(e){const m=why(e);throw new Error(/no_app/.test(m)?'noapp':/not_found|permission|security/i.test(m)?'gone':'fail')}
        return}
      if(!ref.idb)throw new Error('gone');
      const f=await op('readonly',st=>st.get(ref.idb));if(!f)throw new Error('gone');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([f],{type:ref.type}));a.target='_blank';a.rel='noopener';a.download=ref.name;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);
    },
    async del(ref){try{if(!ref)return;if(ref.uri){const fo=FO();if(fo)await fo.release({uri:ref.uri})}else if(ref.idb)await op('readwrite',st=>st.delete(ref.idb))}catch(e){}}
  };
})();

/* selector de géneros: una sola línea con los más usados y un "···" que despliega el resto */
function genPicker(box,order,isOn,toggle){
  let open=false;
  const alpha=(x,y)=>coll.compare(x.dataset.n,y.dataset.n);
  const fold=()=>{
    const more=box.querySelector('[data-more]');
    if(!more)return;
    const chips=[...box.querySelectorAll('[data-g]')].sort((x,y)=>x.dataset.i-y.dataset.i);
    chips.forEach(c=>{box.insertBefore(c,more);c.hidden=false});more.hidden=false;
    if(open){chips.slice().sort(alpha).forEach(c=>box.insertBefore(c,more));more.textContent=t('genLess');return}
    let k=chips.length;
    for(;k>=1;k--){
      chips.forEach((c,i)=>c.hidden=i>=k);
      const hid=chips.length-k;more.hidden=hid===0;more.textContent=hid?'··· +'+hid:'';
      const top=chips[0].offsetTop;
      if(chips.slice(0,k).every(c=>c.offsetTop===top)&&(hid===0||more.offsetTop===top))break;
    }
    if(k<1)k=1;
    [...chips.slice(0,k).sort(alpha),...chips.slice(k).sort(alpha)].forEach(c=>box.insertBefore(c,more));
  };
  const paint=()=>{
    box.innerHTML=order.map((g,i)=>`<button type="button" class="chip" style="--gh:${ghue(g)}" data-i="${i}" data-n="${esc(gname(g))}" data-g="${esc(g)}" aria-pressed="${isOn(g)}">${esc(gname(g))}</button>`).join('')+(order.length>1?`<button type="button" class="chip more" data-more></button>`:'');
    fold();
  };
  box.onclick=e=>{
    if(e.target.closest('[data-more]')){open=!open;fold();return}
    const x=e.target.closest('[data-g]');if(!x)return;
    toggle(x.dataset.g);x.setAttribute('aria-pressed',String(isOn(x.dataset.g)));
  };
  paint();requestAnimationFrame(fold);
  try{document.fonts&&document.fonts.ready&&document.fonts.ready.then(()=>{if(box.isConnected)fold()})}catch(e){}
  setTimeout(()=>{if(box.isConnected)fold()},350);
  try{let w=box.clientWidth;const ro=new ResizeObserver(()=>{if(!box.isConnected){ro.disconnect();return}if(box.clientWidth!==w){w=box.clientWidth;fold()}});ro.observe(box)}catch(e){}
  return {paint,expand(){open=true;fold()}};
}

  const sync=()=>{const v=$('#bs').value,u=$('#bu').value;$('#bordw').style.display=v?'':'none';$('#bsw').classList.toggle('solo',!v);$('#bnew').style.display=v==='__new'?'':'none';
    const ex=v&&v!=='__new',so=ex?saga(v):null;$('#bu').disabled=!!(so&&so.universeId);$('#buow').style.display=(u&&!ex)?'':'none';$('#buw').classList.toggle('solo',!u||!!ex)};
  let autoAu='';
  let autoU=false;
  const fillAu=()=>{const sid=$('#bs').value,par=(sid&&sid!=='__new')?saga(sid):(!sid?uni($('#bu').value):null);
    const el=$('#ba'),cur=el.value.trim();

    put('#bt',m.title,over);put('#ba',m.author,over);

    $('#bfw').style.display=d.file?'':'none';

    if(k==='load'){try{toast(t('reading'));const blob=await FS.get(d.file);const isPdf=/\.pdf$/i.test(d.file.name);
        const base=d.file.name.replace(/\.\w+$/,'').replace(/[_]+/g,' ');

      catch(err){toast(String(err&&err.message)==='gone'?t('fileGone'):t('fileNoRead'))}}
  };
  paintFile();
  const ffl=$('.fromfile[for]');if(ffl)ffl.addEventListener('click',e=>{pickTarget=null;if(NATIVE){e.preventDefault();pickBook(null)}});
  curFill=(m,fname,ref)=>{
    if(ref){if(d.file&&d.file!==ref)removed.push(d.file);d.file=ref;created.push(ref)}

    const ff=$('.fromfile[for]');if(ff){ff.classList.add('done');ff.querySelector('b').textContent=t('fileDone')}
  };
  const cleanup=()=>{created.forEach(r=>{if(!(d.file&&d.file===r))FS.del(r)});};
  onDismiss=()=>{created.forEach(r=>FS.del(r))};
  $('#bcan').onclick=()=>{created.forEach(r=>FS.del(r));closeSheet()};
  if(b)armDelete($('#bdel'),()=>{FS.del(b.file);created.forEach(r=>FS.del(r));S.books=S.books.filter(x=>x.id!==b.id);closeSheet();render();toast(t('bookDeleted'))});
  $('#bok').onclick=()=>{
    const title=$('#bt').value.trim();if(!title){toast(t('missTitle'));$('#bt').focus();return}
    d.title=title;d.author=$('#ba').value.trim()||t('unknown');
    let sid=$('#bs').value;
    if(sid==='__new'){const n=$('#bn').value.trim();
      if(n){const nu=$('#bu').value,nuo=$('#buo').value;const ns={id:uid(),name:n,author:d.author,universeId:nu,universeOrder:(nu&&nuo!=='')?parseFloat(nuo):null,ratingOverride:null};S.sagas.push(ns);sid=ns.id}else sid=''}
    d.sagaId=sid;const o=$('#bo').value;d.sagaOrder=(sid&&o!=='')?parseFloat(o):null;
    const uo=$('#buo').value;

      d.universeId='';d.universeOrder=null;
    }else{
      d.universeId=$('#bu').value;d.universeOrder=(d.universeId&&uo!=='')?parseFloat(uo):null;
    }
    if(!$('#ba').value.trim()){const par=saga(sid)||uni(d.universeId);if(par&&par.author)d.author=par.author}
    const noteV=$('#bnote').value.trim();if(noteV)d.note=noteV;else delete d.note;
    delete d.sagaName;delete d.fromFile;
    removed.forEach(r=>FS.del(r));cleanup();
    d.read=d.status==='read';d.readAt=d.status==='read'?dateFromInput($('#breadat').value):null;
    if(b){const bk=book(b.id);Object.assign(bk,d);if(!noteV)delete bk.note}else{d.id=uid();S.books.push(d)}
    closeSheet();render();toast(b?t('saved'):t('bookAdded'));
  };
}

const OLC={};
function olSearch(title){
  const q=String(title||'').trim(),nq=norm(q);
  if(nq.length<3||navigator.onLine===false)return Promise.resolve([]);
  if(OLC[nq])return OLC[nq];
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
  const pr=(async()=>{
    try{
      const r=await fetch('https://openlibrary.org/search.json?limit=8&fields=title,author_name,subject&title='+encodeURIComponent(q),{signal:ctl.signal});
      if(!r.ok)throw 0;
      const j=await r.json(),docs=(j.docs||[]).filter(d=>d.author_name&&d.author_name.length);
      docs.sort((a,b)=>(norm(b.title).includes(nq)?1:0)-(norm(a.title).includes(nq)?1:0));
      return docs;
    }catch(e){delete OLC[nq];return []}finally{clearTimeout(to)}
  })();
  OLC[nq]=pr;return pr;
}
async function suggestAuthors(title){
  const docs=await olSearch(title),seen=new Set(),out=[];
  for(const d of docs){const a=String(d.author_name[0]).trim();if(a&&!seen.has(norm(a))){seen.add(norm(a));out.push(a)}if(out.length>=4)break}
  return out;
}
/* temas de Open Library (en inglés casi siempre) -> nuestros géneros */
const GMAP=[['fantasy',/fantas|magic|wizard|dragon|fairy|sorcer|brujer|hechic/],['scifi',/science fiction|sci-fi|scifi|ciencia ficci|space opera|aliens|extraterrestr|cyberpunk/],
 ['romance',/romanc|love stor|romantic|amor/],['mystery',/mystery|detective|crime|whodunit|murder|policia|policial|misterio|novela negra/],
 ['thriller',/thriller|suspense|espionage|spy |spies|espionaje/],['horror',/horror|ghost|vampire|zombie|haunted|terror|gothic|g[oó]tic/],
 ['historical',/historical|hist[oó]rica|historic fiction/],['ya',/young adult|juvenile|teen|juvenil|children/],['classic',/classic|cl[aá]sic/],
 ['nonfic',/nonfiction|non-fiction|essays|ensayo|no ficci/],['bio',/biograph|memoir|biograf|autobiograph/],['selfhelp',/self-help|self help|autoayuda|personal development|motivation|desarrollo personal/],
 ['comic',/comic|graphic novel|manga|c[oó]mic|historieta/],['poetry',/poetry|poems|poes[ií]a|poemas/],['adventure',/adventure|aventura/],
 ['dystopia',/dystopi|distop/],['action',/\baction\b|acci[oó]n/],['drama',/\bdrama\b|\bplays\b/]];
function genresFromSubjects(subs){
  const sc=new Map();
  (subs||[]).forEach(x=>{const t2=String(x&&x.name||x).toLowerCase();GMAP.forEach(([g,re])=>{if(re.test(t2))sc.set(g,(sc.get(g)||0)+1)})});
  return [...sc.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,5);
}
async function suggestGenres(title){
  const docs=await olSearch(title),nq=norm(title);
  let pick=docs.filter(d=>norm(d.title).includes(nq)||nq.includes(norm(d.title))).slice(0,3);
  if(!pick.length)pick=docs.slice(0,2);
  return genresFromSubjects(pick.flatMap(d=>d.subject||[]));
}
/* ISBN -> datos del libro (solo con internet) */
const parseSeries=raw=>{ /* "Harry Potter #1" -> {name:'Harry Potter', order:1} */
  if(!raw)return null;const s=String(Array.isArray(raw)?raw[0]:raw).trim();if(!s)return null;
  const m=/^(.*?)[,#]?\s*#?\s*(\d+(?:\.\d+)?)$/.exec(s);
  return m&&m[1].trim()?{name:m[1].trim(),order:parseFloat(m[2])}:{name:s};
};
/* Muchos .epub/.pdf no traen la serie en sus metadatos (solo la traen si se etiquetó con Calibre).
   Si el título y el autor sí se leyeron bien del archivo, buscamos la serie en Open Library por título. */
async function lookupSeriesByTitle(title,author){
  if(navigator.onLine===false||!title)return null;
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),6000);
  try{
    const r=await fetch('https://openlibrary.org/search.json?limit=5&fields=title,author_name,series&title='+encodeURIComponent(title),{signal:ctl.signal});
    if(!r.ok)return null;
    const j=await r.json(),docs=j.docs||[],nt=norm(title),na=norm(author||'');
    let d=docs.find(x=>norm(x.title)===nt&&(!na||(x.author_name||[]).some(a=>norm(a)===na)));
    if(!d&&!na)d=docs.find(x=>norm(x.title)===nt);
    return d?parseSeries(d.series):null;
  }catch(e){return null}finally{clearTimeout(to)}
}
async function isbnLookup(isbn){
  if(navigator.onLine===false)return null;
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
  try{
    let r=await fetch('https://openlibrary.org/search.json?limit=1&fields=title,author_name,subject,cover_i,series&q=isbn:'+encodeURIComponent(isbn),{signal:ctl.signal});
    const j=r.ok?await r.json():{},d=(j.docs||[])[0];
    if(d&&d.title){const sg=parseSeries(d.series);
      return {title:d.title,author:(d.author_name||[])[0]||'',subjects:d.subject||[],cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':'',sagaName:sg&&sg.name,sagaOrder:sg&&sg.order!=null?sg.order:null}}
    r=await fetch('https://openlibrary.org/api/books?format=json&jscmd=data&bibkeys=ISBN:'+encodeURIComponent(isbn),{signal:ctl.signal});
    const k=r.ok?await r.json():{},e=k['ISBN:'+isbn];
    if(e&&e.title)return {title:e.title,author:((e.authors||[])[0]||{}).name||'',subjects:e.subjects||[],cover:(e.cover&&(e.cover.medium||e.cover.small))||''};
    return null;
  }catch(e){return null}finally{clearTimeout(to)}
}
/* ---- Lector de código de barras EAN-13 (ISBN) sin librerías ---- */
const EANL=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EANP=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
const runsOfBits=s=>{const r=[];let c=s[0],n=1;for(let i=1;i<s.length;i++){if(s[i]===c)n++;else{r.push(n);c=s[i];n=1}}r.push(n);return r};
const EANT={L:EANL.map(runsOfBits),
  R:EANL.map(x=>runsOfBits([...x].map(c=>c==='0'?'1':'0').join(''))),
  G:EANL.map(x=>runsOfBits([...x].map(c=>c==='0'?'1':'0').reverse().join('')))};
function eanDigit(w,tabs){
  const T=w[0]+w[1]+w[2]+w[3],u=T/7;let best=null,be=9;
  for(const k of tabs)for(let d=0;d<10;d++){const tb=EANT[k][d];let e=0;for(let j=0;j<4;j++)e+=Math.abs(w[j]/u-tb[j]);if(e<be){be=e;best=[d,k]}}
  return be<1.8?best:null;
}
function eanFromRuns(runs,startDark){
  for(let i=startDark?0:1;i+58<runs.length;i+=2){
    const a=runs[i],b=runs[i+1],c=runs[i+2],m=(a+b+c)/3;
    if(m<1||a>m*1.7||b>m*1.7||c>m*1.7||a<m*.45||b<m*.45||c<m*.45)continue;
    const dg=[];let par='',ok=true;
    for(let k=0;k<6&&ok;k++){const r=eanDigit(runs.slice(i+3+4*k,i+7+4*k),['L','G']);if(!r)ok=false;else{dg.push(r[0]);par+=r[1]}}
    if(!ok)continue;
    const f=EANP.indexOf(par);if(f<0)continue;
    for(let k=0;k<6&&ok;k++){const r=eanDigit(runs.slice(i+32+4*k,i+36+4*k),['R']);if(!r)ok=false;else dg.push(r[0])}
    if(!ok)continue;
    const all=[f,...dg];let sum=0;for(let k=0;k<12;k++)sum+=all[k]*(k%2?3:1);
    if((10-sum%10)%10!==all[12])continue;
    const str=all.join('');if(!/^97[89]/.test(str))continue;
    return str;
  }
  return null;
}
function eanFromRow(g,W){
  const pre=new Float64Array(W+1);for(let x=0;x<W;x++)pre[x+1]=pre[x]+g[x];
  const win=Math.max(20,W>>3),bits=new Uint8Array(W);
  for(let x=0;x<W;x++){const a=Math.max(0,x-win),b=Math.min(W,x+win),mean=(pre[b]-pre[a])/(b-a);bits[x]=g[x]<mean*.9?1:0}
  const runs=[];let c=bits[0],n=1;for(let x=1;x<W;x++){if(bits[x]===c)n++;else{runs.push(n);c=bits[x];n=1}}runs.push(n);
  const first=bits[0]===1;
  let r=eanFromRuns(runs,first);if(r)return r;
  const rev=runs.slice().reverse(),lastDark=(runs.length%2===1)?first:!first;
  return eanFromRuns(rev,lastDark);
}
function eanFromImage(ctx,W,H){
  const img=ctx.getImageData(0,0,W,H).data,g=new Float64Array(W);
  for(let k=0;k<45;k++){
    const y=Math.round(H*(.22+.56*((k*0.618)%1)));
    for(let x=0;x<W;x++){const o=(y*W+x)*4;g[x]=img[o]*.3+img[o+1]*.59+img[o+2]*.11}
    const r=eanFromRow(g,W);if(r)return r;
  }
  return null;
}
const isbnOk=v=>{v=String(v).replace(/[\s-]/g,'');if(/^97[89]\d{10}$/.test(v)){let s2=0;for(let k=0;k<12;k++)s2+=(+v[k])*(k%2?3:1);return (10-s2%10)%10===+v[12]?v:null}
  if(/^\d{9}[\dXx]$/.test(v)){let s2=0;for(let k=0;k<9;k++)s2+=(+v[k])*(10-k);s2+=/x/i.test(v[9])?10:+v[9];return s2%11===0?v.toUpperCase():null}return null};
let scanState=null;
function closeScanner(){const sc=$('#scan');if(scanState){scanState.stop=true;clearTimeout(scanState.t);try{scanState.stream&&scanState.stream.getTracks().forEach(x=>x.stop())}catch(e){}}scanState=null;sc.classList.remove('on');const v=$('#scv');try{v.pause();v.srcObject=null}catch(e){}}
async function openScanner(onIsbn){
  const sc=$('#scan'),v=$('#scv'),msg=$('#scmsg'),inp=$('#scisbn');
  $('#scx').textContent=t('cancel');$('#scgo').textContent=t('ok');inp.placeholder=t('scanManual');msg.textContent=t('scanT');inp.value='';
  sc.classList.add('on');
  const st=scanState={stop:false,t:0,stream:null};
  const done=isbn=>{if(st.stop)return;closeScanner();onIsbn(isbn)};
  $('#scx').onclick=closeScanner;
  const manual=()=>{const k=isbnOk(inp.value);if(!k){toast(t('isbnBad'));return}done(k)};
  $('#scgo').onclick=manual;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();manual()}};
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
    st.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(st.stop){st.stream.getTracks().forEach(x=>x.stop());return}

  }catch(e){msg.textContent=t('camDenied');return}

    if(st.stop)return;

      if(v.videoWidth){
        const W=Math.min(800,v.videoWidth),H=Math.round(v.videoHeight/v.videoWidth*W);cv.width=W;cv.height=H;ctx.drawImage(v,0,0,W,H);
        let code=null;
        if(det){try{const r=await det.detect(cv);if(r&&r[0]){const k=isbnOk(r[0].rawValue);if(k)code=k}}catch(e){det=null}}
        if(!code){const r=eanFromImage(ctx,W,H);if(r&&isbnOk(r))code=r}
        if(code){done(code);return}
      }
    }catch(e){}
    st.t=setTimeout(tick,140);
  };
  tick();
}

const REPO='oliveA3/to-be-read-releases'; /* repo PÚBLICO solo de descargas; el código fuente vive en to-be-read (privado o público, aparte) */
let UPD=null,updBusy=false,updPct=-1;

async function checkUpdate(){

  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch('https://api.github.com/repos/'+REPO+'/releases/latest',{signal:ctl.signal,headers:{Accept:'application/vnd.github+json'}});
    if(!r.ok)throw 0;const j=await r.json();
    const m=/(\d+\.\d+\.\d+)(?:-build(\d+))?/.exec(j.tag_name||'');if(!m)throw 0;
    const ver=m[1],bld=m[2]?+m[2]:0,newer=bld?bld>BUILD:cmpVer(ver,VERSION)>0;
    const a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name||''));
    UPD=newer&&a?{ver,bld,url:a.browser_download_url,page:j.html_url}:{none:true};
    try{localStorage.setItem('por-leer-upd',String(Date.now()))}catch(e){}

  }catch(e){return 'fail'}finally{clearTimeout(to)}

    try{h=await fo.addListener('updateProgress',e=>onProg&&onProg(e.pct))}catch(e){}

/* ---- Compartir lista (formato "[X] Título (n) - Autor [5.0]") ---- */
function shareText(opt){
  const rows=[];const r1=v=>v>0?` [${(Math.round(v*2)/2).toFixed(1)}]`:'';
  const bookLine=b=>({done:fin(b),name:b.title,rating:rat(b),recent:idx(b),line:`[${stOf(b)==='read'?'X':stOf(b)==='dropped'?'-':' '}] ${b.title} - ${b.author}${fin(b)?r1(rat(b)):''}`});
  S.sagas.forEach(s=>{const all=booksOf(s.id);const done=all.length>0&&all.every(fin);
    /* saga a medio leer: cada libro en su línea */
    if(all.some(fin)&&!done){all.forEach(b=>rows.push(bookLine(b)));return}
    rows.push({done,name:s.name,rating:sagaRating(s)||0,recent:all.length?Math.max(...all.map(idx)):-1,line:`[${done?'X':' '}] ${s.name}${all.length>1?` (${all.length})`:''} - ${s.author}${done?r1(sagaRating(s)):''}`})});
  S.books.filter(b=>!saga(b.sagaId)).forEach(b=>rows.push(bookLine(b)));
  const f=rows.filter(x=>x.done?opt.read:opt.unread);sortItems(f);
  return f.map(x=>x.line).join('\n');
}

/* Portadas ligeras: si una portada pesa demasiado se reduce (tamaño y calidad) hasta que quede pequeña */
function shrink(url,w=200,max=16000){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
  const nw=im.naturalWidth||w,nh=im.naturalHeight||Math.round(w*1.5);let out='';
  for(const [sw,q] of [[w,.7],[Math.round(w*.85),.6],[Math.round(w*.7),.5],[Math.round(w*.6),.42]]){
    const ww=Math.max(24,Math.min(sw,nw)),c=document.createElement('canvas');c.width=ww;c.height=Math.max(1,Math.round(nh/nw*ww));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<=max)break}
  res(out)};im.onerror=rej;im.src=url})}
/* Al abrir la app, las portadas guardadas que pesen mucho se reducen poco a poco */
const slimTried=new Set();
async function slimCovers(){
  const todo=()=>S.books.filter(b=>b.cover&&b.cover.length>40000&&!slimTried.has(b.id));
  const big=todo().slice(0,20);if(!big.length)return;
  let ch=false;
  for(const b of big){slimTried.add(b.id);try{const n=await shrink(b.cover,200);if(n.length<b.cover.length){b.cover=n;ch=true}}catch(e){}}
  if(ch){save();render(false)}
  if(todo().length)setTimeout(slimCovers,3000);
}
const fileRF=f=>({size:f.size,async read(o,l){return new Uint8Array(await f.slice(o,o+l).arrayBuffer())}});
/* Lee un .epub (zip) por trozos: directorio central + solo los archivos que se necesitan */
async function rangeZip(rf){
  await lib('lib/jszip.min.js');
  const tl=Math.min(rf.size,65557),tail=await rf.read(rf.size-tl,tl);
  let e=-1;for(let i=tail.length-22;i>=0;i--){if(tail[i]===0x50&&tail[i+1]===0x4b&&tail[i+2]===5&&tail[i+3]===6){e=i;break}}
  if(e<0)throw new Error('zip');
  const tv=new DataView(tail.buffer,tail.byteOffset,tail.byteLength);
  const n=tv.getUint16(e+10,true),cdSize=tv.getUint32(e+12,true),cdOff=tv.getUint32(e+16,true);
  if(cdSize===0xFFFFFFFF||cdOff===0xFFFFFFFF||cdSize>24*1048576)throw new Error('zip');
  const cd=await rf.read(cdOff,cdSize),dv=new DataView(cd.buffer,cd.byteOffset,cd.byteLength),dec=new TextDecoder(),ent=new Map();
  for(let p=0,k=0;k<n&&p+46<=cd.length;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
    ent.set(dec.decode(cd.subarray(p+46,p+46+nl)),{rec:cd.subarray(p,p+46+nl),csize:dv.getUint32(p+20,true),usize:dv.getUint32(p+24,true),off:dv.getUint32(p+42,true),nl});
    p+=46+nl+el+cl;
  }
  return {file(name){
    const en=ent.get(name);if(!en)return null;
    return {async async(type){
      if(en.csize>24*1048576)throw new Error('big');
      const lh=await rf.read(en.off,30),lv=new DataView(lh.buffer,lh.byteOffset,lh.byteLength);
      const data=await rf.read(en.off+30+lv.getUint16(26,true)+lv.getUint16(28,true),en.csize);
      /* mini-zip con un solo archivo, para que JSZip lo descomprima */
      const nl=en.nl,name8=en.rec.subarray(46,46+nl),lhLen=30+nl,cdLen=46+nl,total=lhLen+en.csize+cdLen+22,out=new Uint8Array(total),ov=new DataView(out.buffer);
      const r=en.rec,rv=new DataView(r.buffer,r.byteOffset,r.byteLength);
      ov.setUint32(0,0x04034b50,true);ov.setUint16(4,20,true);ov.setUint16(6,rv.getUint16(8,true)&~8,true);ov.setUint16(8,rv.getUint16(10,true),true);
      ov.setUint16(10,rv.getUint16(12,true),true);ov.setUint16(12,rv.getUint16(14,true),true);ov.setUint32(14,rv.getUint32(16,true),true);
      ov.setUint32(18,en.csize,true);ov.setUint32(22,en.usize,true);ov.setUint16(26,nl,true);ov.setUint16(28,0,true);
      out.set(name8,30);out.set(data,lhLen);
      const c0=lhLen+en.csize;out.set(r.subarray(0,cdLen),c0);
      ov.setUint16(c0+8,rv.getUint16(8,true)&~8,true);ov.setUint16(c0+30,0,true);ov.setUint16(c0+32,0,true);ov.setUint32(c0+42,0,true);
      const e0=c0+cdLen;ov.setUint32(e0,0x06054b50,true);ov.setUint16(e0+8,1,true);ov.setUint16(e0+10,1,true);ov.setUint32(e0+12,cdLen,true);ov.setUint32(e0+16,c0,true);
      const z=await JSZip.loadAsync(out);return z.file(dec.decode(name8)).async(type);
    }};
  }};
}
async function readEpub(file){
  await lib('lib/jszip.min.js');
  const zip=file.rf?await rangeZip(file.rf):await JSZip.loadAsync(file);
  const P=new DOMParser();
  const cx=P.parseFromString(await zip.file('META-INF/container.xml').async('string'),'application/xml');
  const opfPath=cx.querySelector('rootfile').getAttribute('full-path');
  const opf=P.parseFromString(await zip.file(opfPath).async('string'),'application/xml');
  const g=n=>{const e=opf.getElementsByTagNameNS('*',n)[0];return e?e.textContent.trim():''};
  const out={fromFile:true,title:g('title'),author:g('creator')};
  let series='',ix='';
  opf.querySelectorAll('meta').forEach(m=>{
    const n=m.getAttribute('name'),p=m.getAttribute('property');
    if(n==='calibre:series')series=m.getAttribute('content');
    if(n==='calibre:series_index')ix=m.getAttribute('content');
    if(p==='belongs-to-collection'&&!series)series=m.textContent.trim();
    if(p==='group-position'&&!ix)ix=m.textContent.trim();
  });
  if(series){out.sagaName=series;if(ix&&!isNaN(parseFloat(ix)))out.sagaOrder=parseFloat(ix)}
  try{
    const items=[...opf.getElementsByTagName('item')];
    let it=items.find(i=>(i.getAttribute('properties')||'').includes('cover-image'));
    if(!it){const cm=[...opf.querySelectorAll('meta')].find(m=>m.getAttribute('name')==='cover');
      if(cm)it=items.find(i=>i.getAttribute('id')===cm.getAttribute('content'))}
    if(!it)it=items.find(i=>/cover/i.test(i.getAttribute('id')||'')&&/image/.test(i.getAttribute('media-type')||''));
    if(it){
      const dir=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';
      const parts=[];(dir+decodeURIComponent(it.getAttribute('href'))).split('/').forEach(p=>{if(p==='..')parts.pop();else if(p&&p!=='.')parts.push(p)});
      const f=zip.file(parts.join('/'));
      if(f){const blob=new Blob([await f.async('uint8array')],{type:it.getAttribute('media-type')||'image/jpeg'});
        out.cover=await shrink(URL.createObjectURL(blob))}
    }
  }catch(e){}
  return out;
}
async function readPdf(file){
  const pdfjsLib=await import(new URL('lib/pdf.min.js',document.baseURI).href);
  if(!globalThis.pdfjsWorker)globalThis.pdfjsWorker=await import(new URL('lib/pdf.worker.min.js',document.baseURI).href);
  let src;
  if(file.rf){
    const rf=file.rf,tr=new pdfjsLib.PDFDataRangeTransport(rf.size,await rf.read(0,Math.min(rf.size,65536)));
    tr.requestDataRange=(b,e)=>{rf.read(b,Math.min(e,rf.size)-b).then(c=>tr.onDataRange(b,c),()=>{})};
    src={range:tr,length:rf.size,disableAutoFetch:true,disableStream:true,isEvalSupported:false};
  }else src={data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false};
  const task=pdfjsLib.getDocument(src);
  const pdf=await Promise.race([task.promise,new Promise((_,ko)=>setTimeout(()=>ko(new Error('timeout')),30000))]);
  const info=((await pdf.getMetadata()).info)||{};
  const out={fromFile:true,title:(info.Title||'').trim(),author:(info.Author||'').trim()};
  try{
    const page=await pdf.getPage(1),v0=page.getViewport({scale:1}),v=page.getViewport({scale:300/v0.width});
    const c=document.createElement('canvas');c.width=v.width;c.height=v.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    out.cover=await shrink(c.toDataURL('image/jpeg',.8));
  }catch(e){}
  return out;
}
/* Lee los metadatos de un archivo ya elegido (epub/pdf) sin nunca tirar error: si algo falla,
   devuelve al menos el título sacado del nombre del archivo. Se usa al elegir el archivo
   y también al "recargar datos" de uno ya adjunto, para que ambos caminos se comporten igual. */
async function readMetaSafe(reader,base){
  let meta;
  try{
    meta=await reader();
    /* el archivo sí se pudo leer: si no trae serie, intentamos encontrarla por título (no bloquea el guardado si falla) */
    if(meta.title&&!meta.sagaName){try{const sg=await lookupSeriesByTitle(meta.title,meta.author);if(sg&&sg.name){meta.sagaName=sg.name;if(sg.order!=null&&meta.sagaOrder==null)meta.sagaOrder=sg.order}}catch(e){}}
    if(!meta.title)meta.title=base;
  }catch(err){meta={fromFile:true,title:base};
    const why=String((err&&(err.message||err))||'?').slice(0,60);
    toast(t('noMeta')+' ['+why+']')}
  return meta;
}
async function processPicked(f,ref0,cb){
  const ext=f.name.split('.').pop().toLowerCase();

  toast(t('reading'));

  const src=f.rf||(f.size>MAXMETA?fileRF(f):null),rd=x=>ext==='epub'?readEpub(x):readPdf(x);

    }

  let ref=ref0;

  if(cb){await cb(f,meta,ref);return}
  toast(t('detectedT'));
  if(curFill&&$('#sheet').classList.contains('on')&&$('.fromfile[for]')){if($('#bt').value.trim()&&meta.title===base)delete meta.title;curFill(meta,f.name,ref)}
  else bookForm(null,Object.assign(meta,{file:ref}));
}
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';const cb=pickTarget;pickTarget=null;if(!f)return;
  await processPicked(f,null,cb);
};

/* ---------- eventos ---------- */
function closeMenu(){$('#menu').classList.remove('on');$('#fab').classList.remove('on')}
$('#fab').onclick=()=>{$('#menu').classList.toggle('on');$('#fab').classList.toggle('on')};
$('#statsbtn').onclick=()=>{closeMenu();statsForm()};
$('#gear').onclick=()=>{closeMenu();settingsForm()};
$('#sharebtn').onclick=()=>{closeMenu();shareForm()};
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{ui.q=e.target.value.trim();render(false)},160)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.ghead'))e.target.click();if(e.key==='Escape')dismissSheet()});
document.addEventListener('click',e=>{
  if(e.target.closest('#sheet'))return;
  const x=e.target.closest('[data-a]');
  if(!e.target.closest('#menu,#fab'))closeMenu();
  if(!x)return;
  const a=x.dataset.a,id=x.dataset.id;
  if(a==='status-book')return statusForm(book(id));
  if(a==='open-file')return openBookFile(book(id));
  if(a==='rate-book')return rateForm(book(id));
  if(a==='edit-book')return bookForm(book(id));
  if(a==='edit-saga')return sagaForm(saga(id));
  if(a==='edit-uni')return uniForm(uni(id));
  if(a==='toggle-open'){const card=x.parentElement;const op=!card.classList.contains('open');ui.open[id]=op;if(op&&LAZY.has(id)){const gb=card.querySelector(':scope>.gbody');if(gb){gb.innerHTML=LAZY.get(id)()}LAZY.delete(id)}card.classList.toggle('open',op);return}
  if(a==='genre-tag'){const g=x.dataset.g;ui.genres=(ui.genres.length===1&&ui.genres[0]===g)?[]:[g];render(false);return}
  if(a==='tgdone'){HD=!HD;try{localStorage.setItem('por-leer-hd',HD?'1':'0')}catch(e){}render(false);const le=$('#list');if(le){le.classList.remove('swap');void le.offsetWidth;le.classList.add('swap')}return}
  if(a==='status'){ui.status=x.dataset.k;render(false);return}
  if(a==='filters')return filterForm();
  if(a==='new-book'){closeMenu();return bookForm(null)}
  if(a==='new-saga'){closeMenu();return sagaForm(null)}
  if(a==='new-uni'){closeMenu();return uniForm(null)}
  if(a==='import'){setTimeout(closeMenu,50)}
});
if(CAP&&CAP.App)CAP.App.addListener('backButton',()=>{if($('#scan').classList.contains('on'))closeScanner();else if($('#sheet').classList.contains('on'))dismissSheet();else if($('#menu').classList.contains('on'))closeMenu();else CAP.App.exitApp()});

/* ---------- mantener pulsado: reordenar o sacar de una saga/universo ---------- */
(function(){
  const list=$('#list'),bar=$('#dragbar');
  let pend=null,tm=null,D=null,swallowAt=0,rafId=0,lastY=0,lastX=0;
  const cancel=()=>{clearTimeout(tm);tm=null;pend=null};
  const parentOf=grp=>grp[0]==='s'?saga(grp.slice(2)):uni(grp.slice(2));
  const objOf=dk=>dk[0]==='b'?book(dk.slice(2)):saga(dk.slice(2));
  list.addEventListener('pointerdown',e=>{
    if(D||!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;
    const el=e.target.closest('[data-dk]');if(!el)return;
    if(e.target.closest('.pen,.seal,.br,.tag'))return;
    cancel();pend={el,x:e.clientX,y:e.clientY};lastY=e.clientY;lastX=e.clientX;
    tm=setTimeout(begin,430);
  });
  document.addEventListener('pointermove',e=>{
    lastY=e.clientY;lastX=e.clientX;
    if(pend&&!D){if(Math.abs(e.clientX-pend.x)>9||Math.abs(e.clientY-pend.y)>9)cancel();return}
    if(D){update()}
  });
  document.addEventListener('touchmove',e=>{if(D&&e.cancelable)e.preventDefault()},{passive:false});
  list.addEventListener('contextmenu',e=>{if(pend||D)e.preventDefault()});
  document.addEventListener('click',e=>{if(performance.now()-swallowAt<450){e.preventDefault();e.stopPropagation()}},true);
  function begin(){
    tm=null;if(!pend)return;const el=pend.el;pend=null;
    if(filtering()){toast(t('dragNoFilter'));return}
    const grp=el.dataset.grp||'',sibs=grp?[...list.querySelectorAll('[data-grp="'+grp+'"]')]:[el];
    if(sibs.length<1)return;
    const sy=scrollY,r=sibs.map(x=>{const b=x.getBoundingClientRect();return {top:b.top+sy,h:b.height}});
    const i0=sibs.indexOf(el),cs=getComputedStyle(el);
    const cb=grp?el.parentElement.getBoundingClientRect():{top:0,bottom:0};
    D={el,grp,dk:el.dataset.dk,sibs,r,i0,ni:i0,out:false,y0:lastY,s0:sy,
       h:r[i0].h+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0),
       ctop:cb.top+sy,cbot:cb.bottom+sy,pname:grp?((parentOf(grp)||{}).name||''):'',tgt:null,tgtKey:null};
    document.body.classList.add('dragging');
    D.anc=[];for(let n=el.parentElement;n&&n!==list;n=n.parentElement){if(n.classList&&n.classList.contains('card')){n.classList.add('dg-anc');D.anc.push(n)}}
    sibs.forEach(x=>{if(x!==el)x.classList.add('dsib')});el.classList.add('lift');
    try{navigator.vibrate&&navigator.vibrate(18)}catch(_){}
    bar.textContent=grp?t('dragMove'):t('dragFree');bar.classList.remove('out');bar.classList.add('on');
    loop();update();
  }
  function update(){
    if(!D)return;
    const sy=scrollY,dy=(lastY-D.y0)+(sy-D.s0);
    D.el.style.transform='translateY('+dy+'px)';
    const c=D.r[D.i0].top+D.r[D.i0].h/2+dy;
    let ni=0;D.r.forEach((q,j)=>{if(j!==D.i0&&q.top+q.h/2<c)ni++});
    const py=lastY+sy;
    let out=D.grp?(py<D.ctop-30||py>D.cbot+30):false;
    /* ¿está encima de una saga/universo donde se pueda meter? (solo fuera de su propio contenedor) */
    let tgt=null;
    if(!D.grp||out){
      const isBook=D.dk[0]==='b';
      const els=document.elementsFromPoint(lastX,lastY);
      for(const e0 of els){
        if(D.el.contains(e0))continue;
        let n=e0.closest('[data-drop]');
        while(n){const k=n.dataset.drop;
          if(!D.el.contains(n)&&k!==D.grp&&(isBook||k[0]==='u')){tgt=n;break}
          n=n.parentElement?n.parentElement.closest('[data-drop]'):null}
        if(tgt)break;
      }
    }
    if(tgt!==D.tgt){
      if(D.tgt)D.tgt.classList.remove('droptgt');
      D.tgt=tgt;D.tgtKey=tgt?tgt.dataset.drop:null;
      if(tgt)tgt.classList.add('droptgt');
    }
    if(tgt){const o=D.tgtKey[0]==='s'?saga(D.tgtKey.slice(2)):uni(D.tgtKey.slice(2));
      bar.textContent=t('dragInto',(o&&o.name)||'');bar.classList.remove('out');D.el.classList.remove('out');D.out=false;out=false}
    else if(out!==D.out||D.was!==(tgt?1:0)){D.out=out;D.el.classList.toggle('out',out);bar.classList.toggle('out',out);bar.textContent=out?t('dragOut',D.pname):(D.grp?t('dragMove'):t('dragFree'))}
    D.was=tgt?1:0;
    if(out||tgt)ni=D.i0;
    D.ni=ni;
    D.sibs.forEach((x,j)=>{if(j===D.i0)return;let sh=0;
      if(ni>D.i0&&j>D.i0&&j<=ni)sh=-D.h;else if(ni<D.i0&&j>=ni&&j<D.i0)sh=D.h;
      x.style.transform=sh?'translateY('+sh+'px)':''});
  }
  function loop(){
    cancelAnimationFrame(rafId);
    const f=()=>{if(!D)return;const H=innerHeight;
      if(Math.abs(lastY-D.y0)>10)D.moved=true;
      if(D.moved){if(lastY<110)scrollBy(0,-Math.min(16,(110-lastY)/6+2));else if(lastY>H-140)scrollBy(0,Math.min(16,(lastY-(H-140))/6+2))}
      update();rafId=requestAnimationFrame(f)};
    rafId=requestAnimationFrame(f);
  }
  function finish(ok){
    cancel();if(!D)return;const d=D;D=null;cancelAnimationFrame(rafId);
    d.sibs.forEach(x=>{x.style.transform='';x.classList.remove('dsib')});
    d.el.style.transform='';d.el.classList.remove('lift','out');
    document.body.classList.remove('dragging');bar.classList.remove('on');(d.anc||[]).forEach(n=>n.classList.remove('dg-anc'));
    swallowAt=performance.now();
    if(d.tgt)d.tgt.classList.remove('droptgt');
    if(!ok)return;
    if(d.tgtKey){
      const o=objOf(d.dk);if(!o)return;const id=d.tgtKey.slice(2);
      if(d.tgtKey[0]==='s'){
        const mx=Math.max(0,...booksOf(id).map(x=>+x.sagaOrder||0));
        o.sagaId=id;o.sagaOrder=mx+1;o.universeId='';o.universeOrder=null;
      }else{
        const mx=Math.max(0,...S.sagas.filter(x=>x.universeId===id).map(x=>+x.universeOrder||0),...looseOf(id).map(x=>+x.universeOrder||0));
        if(d.dk[0]==='b'){o.sagaId='';o.sagaOrder=null}
        o.universeId=id;o.universeOrder=mx+1;
      }
      ui.open[id]=true;
      const tg=d.tgtKey[0]==='s'?saga(id):uni(id);
      render();toast(t('movedInto',(tg&&tg.name)||''));return;
    }
    if(d.out){
      const o=objOf(d.dk);if(!o)return;
      if(d.dk[0]==='b'){
        if(d.grp[0]==='s'){const sg=saga(o.sagaId);o.sagaId='';o.sagaOrder=null;
          if(sg&&sg.universeId){o.universeId=sg.universeId;o.universeOrder=null}}
        else{o.universeId='';o.universeOrder=null}
      }else{o.universeId='';o.universeOrder=null}
      render();toast(t('takenOut',d.pname));return;
    }
    if(d.ni!==d.i0){
      const order=d.sibs.map(x=>x.dataset.dk);const [m]=order.splice(d.i0,1);order.splice(d.ni,0,m);
      order.forEach((k,i)=>{const o=objOf(k);if(!o)return;if(d.grp[0]==='s')o.sagaOrder=i+1;else o.universeOrder=i+1});
      render();toast(t('reordered'));
    }
  }
  document.addEventListener('pointerup',()=>finish(true));
  document.addEventListener('pointercancel',()=>finish(false));
  addEventListener('blur',()=>finish(false));
})();
(function(){const st=$('#stick'),se=$('#sent');
  try{new IntersectionObserver(en=>{st.classList.toggle('on',!en[0].isIntersecting)},{threshold:0}).observe(se)}catch(e){}})();
applyStatic();
render(false);
bootStore().then(()=>setTimeout(slimCovers,4000));
autoUpdateCheck();
</script>
